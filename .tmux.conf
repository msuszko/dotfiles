
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# pi.dev recommendations
set -g extended-keys on
set -g extended-keys-format csi-u

# reload config file (change file location to your the tmux.conf you want to use)
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# map Vi movement keys as pane movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes using PREFIX H, J, K, L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# and use C-h and C-l to cycle thru windows
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# bind space to next window
unbind " "
bind " " next-window

# split panes using | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Enable mouse control (clickable windows, panes, resizable panes)
# Enable mouse mode (tmux 2.1 and above)
set -g mouse on
set-option -g focus-events on

# notifications
setw -g monitor-activity on
setw -g visual-activity on

# auto rename
set -g automatic-rename on

# don't rename windows automatically
set-option -g allow-rename off

# set terminal title
set -g set-titles on
set -g set-titles-string "#S:#W"

setw -g word-separators ' @"=()[]'
setw -ag word-separators "'"

# make tmux display things in 256 colors
set-option -g default-terminal "tmux-256color"

# set scrollback history to 10000 (10k)
set -g history-limit 10000

# shorten command delay
set -sg escape-time 10

# start window numbering at 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-option -sa terminal-features ',tmux-256color:RGB,xterm-ghostty:RGB'

############ colors ############
# set status bar
set -g status-right "#[fg=green]#H #[fg=yellow]%H:%M"
set-option -g status-bg colour235 #base02
set-option -g status-fg yellow #yellow
set-window-option -g window-status-current-style "bg=grey"


# set session variables
set-option -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY WAYLAND_DISPLAY"

############ clipboard ############
# let tmux set the system clipboard via OSC 52 (works locally and over ssh)
set -g set-clipboard on
# also write the Wayland clipboard directly, so every copy lands in CLIPBOARD
set -s copy-command 'wl-copy'
set -as terminal-features ',*:clipboard'

# vi keys in copy mode; select with v, copy with y / mouse release
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel

# paste the tmux buffer with prefix + ] (bracketed); prefix + p is previous window
bind ] paste-buffer -p
bind p previous-window

# middle click pastes the system CLIPBOARD (not tmux's buffer or PRIMARY);
# even in apps that grab the mouse (pi), copy mode still gets the click
bind -n MouseDown2Pane if -F '#{pane_in_mode}' 'send -M' 'run "wl-paste -n | tmux load-buffer -w -" ; paste-buffer -p'
